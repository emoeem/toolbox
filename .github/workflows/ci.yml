name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # PySide6 links against libEGL/libGL at import time; without these the
      # whole Qt layer (and therefore every UI test module) fails to import
      # with "ImportError: libEGL.so.1: cannot open shared object file".
      - name: Install Qt / OpenGL runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      # Optional external backend used by the Shader Studio tests.
      # G'MIC is deliberately NOT installed: it is an optional backend, the app
      # degrades without it, and its first invocation builds a command cache for
      # ~15s, which makes it a poor fit for a required status check. The
      # G'MIC-dependent tests skip when the binary is absent.
      - name: Install glslang (optional GLSL validator)
        run: |
          sudo apt-get install -y --no-install-recommends glslang-tools
          glslangValidator --version | head -1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # The pure-Python fallback is what runs when numba is absent (the default
      # for most users) and it is NOT equivalent to the JIT path: numba returns
      # inf from math.pow where CPython raises OverflowError. Force it so this
      # path is always exercised.
      #
      # 既有缺陷绕过（phase0-font-system 分支 gdb 诊断，main 上可复现）：
      # 全部测试通过后，解释器退出阶段 PySide::destroyQCoreApplication 仍会对
      # 无事件循环环境下遗留的 QObject 包装双重析构并 abort（exit 134），
      # 覆盖真实的测试退出码。用 os._exit 在读取结果后立即退出、跳过该清理
      # 路径；退出码只反映测试通过与否。根因随旧 UI 退役而消失（新 UI 测试
      # 不构造这些 widget 图）。
      - name: Tests (pure-Python fallback, no numba)
        env:
          QT_QPA_PLATFORM: offscreen
          TOOLBOX_NO_NUMBA: "1"
        run: |
          python - <<'PY' ; code=$? ; echo "suite-exit=$code" ; test "$code" -eq 0
          import os, sys, unittest
          suite = unittest.TestLoader().discover("tests")
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          sys.stdout.flush()
          sys.stderr.flush()
          os._exit(0 if result.wasSuccessful() else 1)
          PY

      # 诊断（临时）：全量套件在退出期出现 heap corruption（exit 134），
      # test_fonts 单独运行已排除。以下二分定位引入组合，定位后移除。
      - name: "Diagnose: new test modules together"
        if: always()
        run: |
          QT_QPA_PLATFORM=offscreen python -m unittest tests.test_fonts tests.test_worker_protocol tests.test_engine_baseline -v > /tmp/diag1.log 2>&1 || true
          tail -6 /tmp/diag1.log
      - name: "Diagnose: fonts + main_window_static"
        if: always()
        run: |
          QT_QPA_PLATFORM=offscreen python -m unittest tests.test_fonts tests.test_main_window_static -v > /tmp/diag2.log 2>&1 || true
          tail -6 /tmp/diag2.log
      - name: "Diagnose: fonts + thread modules"
        if: always()
        run: |
          QT_QPA_PLATFORM=offscreen python -m unittest tests.test_fonts tests.test_task_and_history tests.test_workbench -v > /tmp/diag3.log 2>&1 || true
          tail -6 /tmp/diag3.log
      - name: "Diagnose: fonts + GL modules"
        if: always()
        run: |
          QT_QPA_PLATFORM=offscreen python -m unittest tests.test_fonts tests.test_shader_studio tests.test_texture_studio -v > /tmp/diag4.log 2>&1 || true
          tail -6 /tmp/diag4.log
      - name: "Diagnose: full suite under PYTHONMALLOC=debug"
        if: always()
        run: |
          QT_QPA_PLATFORM=offscreen TOOLBOX_NO_NUMBA=1 PYTHONMALLOC=debug python -m unittest discover -s tests > /tmp/diag5.log 2>&1 || true
          grep -E "Debug memory|block at|Extension modules|Fatal|Aborted|Current thread" /tmp/diag5.log | head -15 || tail -10 /tmp/diag5.log
      - name: "Diagnose: fonts + task_and_history"
        if: always()
        run: |
          QT_QPA_PLATFORM=offscreen python -m unittest tests.test_fonts tests.test_task_and_history -v > /tmp/diagA.log 2>&1 || true
          tail -4 /tmp/diagA.log
      - name: "Diagnose: fonts + workbench"
        if: always()
        run: |
          QT_QPA_PLATFORM=offscreen python -m unittest tests.test_fonts tests.test_workbench -v > /tmp/diagB.log 2>&1 || true
          tail -4 /tmp/diagB.log
      - name: "Diagnose: task_and_history + workbench without fonts"
        if: always()
        run: |
          QT_QPA_PLATFORM=offscreen python -m unittest tests.test_task_and_history tests.test_workbench -v > /tmp/diagC.log 2>&1 || true
          tail -4 /tmp/diagC.log
      - name: "Diagnose: gdb backtrace of the crashing combo"
        if: always()
        run: |
          sudo apt-get install -y --no-install-recommends gdb > /dev/null 2>&1
          QT_QPA_PLATFORM=offscreen gdb -q -batch -ex run -ex "bt 25" --args python -m unittest tests.test_fonts tests.test_task_and_history tests.test_workbench > /tmp/diagG.log 2>&1 || true
          tail -40 /tmp/diagG.log
      - name: "Diagnose: faulthandler + PYTHONMALLOC=debug on crashing combo"
        if: always()
        run: |
          QT_QPA_PLATFORM=offscreen PYTHONMALLOC=debug python -X faulthandler -m unittest tests.test_fonts tests.test_task_and_history tests.test_workbench > /tmp/diagF.log 2>&1 || true
          grep -B2 -A25 "Fatal Python error\|Current thread" /tmp/diagF.log | head -45 || tail -20 /tmp/diagF.log
      - name: "Diagnose: same combos on origin/main (control group)"
        if: always()
        run: |
          git fetch origin main --depth=1
          git worktree add /tmp/main-check origin/main
          for combo in "tests.test_task_and_history tests.test_workbench"; do
            echo "=== main: $combo ==="
            cd /tmp/main-check
            PYTHONPATH=/tmp/main-check QT_QPA_PLATFORM=offscreen python -m unittest $combo -v > /tmp/diagM.log 2>&1 || true
            tail -25 /tmp/diagM.log
            cd "$GITHUB_WORKSPACE"
          done

      # ...and cover the accelerated paths as well.
      - name: Tests (numba JIT paths)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install numba
          python -m unittest tests.test_fractal tests.test_filter_robustness tests.test_core -v

  # Toolbox 2.0 native prototype (master plan Phase 2/3): Linux CI builds the
  # C++/QML app and runs CTest. This is a Linux runner but NOT the target
  # desktop acceptance — Wayland/GPU validation stays with the target env.
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # Qt 6 dev packages from the distro match the CMake floor (6.4).
      - name: Install Qt 6 dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-declarative-dev ninja-build clang-format clang-tidy

      - name: Configure (CMake preset linux-ci)
        run: cmake --preset linux-ci

      - name: Build
        run: cmake --build --preset linux-ci

      - name: C++ format check
        run: |
          find native tests/native -name '*.h' -o -name '*.cpp' | \
            xargs clang-format --dry-run --Werror

      - name: C++ static analysis (advisory baseline)
        run: |
          clang-tidy -p build/linux-ci --quiet \
            native/models/tool_model.cpp native/backend/ipc_protocol.cpp || true

      - name: Tests (CTest)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset linux-ci
